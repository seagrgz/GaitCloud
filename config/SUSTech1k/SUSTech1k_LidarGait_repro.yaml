DATA:
  data_name: SUSTech1K
  data_root: dataset/SUSTech1K/SUSTech1K-depthimg/
  frame_size: 30
  feature: 3 #input channel
  splits_variance: ['00-nm', '01-nm', 'bg', 'cl', 'cr', 'ub', 'uf', 'oc', 'nt']
  splits_view: ['000', '045', '090', '135', '180', '225', '270', '315', '000-far', '090-near', '180-far', '270-far']
  target:
  structure: LidarGait
  datatype: half #bf16

  reload_data: True
  identifier: L3_

  visual: False
  visual_freq: 20
  visual_list: {
        test: ['01-nm_090_0223', '01-bg_090_0013', '01-cl_090_0400', '00-nm_090_0400', '01-cr_090_0110', '01-ub_090_0333', '00-nm_090_0400'],
        train: ['01-ub_090_0301', '00-nm_090_0301']
        }

TRAIN:
  use_gpu: True
  use_metric: True
  use_Aloss: True #set to False to use metric learning only
  ignore_label: None
  train_gpu: [0]
  workers: 8  # data loader workers
  batch_size: 8 # batch size for training
  batch_size_test: 256
  base_lr: 0.05
  epochs: 100
  start_epoch: 0
  step_epoch: 30
  momentum: 0.9
  weight_decay: 0.0005
  manual_seed: 7777

  free_memory_required: 1024
  save_checkpoint: True
  check_freq: 10
  load_checkpoint: False #set to False to start a new trial
  checkpoint_timestamp: '2024-02-02 07:21:51.009417'
  train_eval: False
  eval_start: 1.0
  eval_freq: 1
